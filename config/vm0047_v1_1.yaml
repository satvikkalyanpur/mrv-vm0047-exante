# VM0047 rule set used by the engine.
#
# Every value below is a methodology rule, not a project choice. Each carries
# the place it comes from. Section and equation numbers follow the VM0047 v1.0
# text (Sept 2023); v1.1 (active 14 May 2025) is a minor revision whose
# published change list does not touch these equations. Check numbering against
# the v1.1 PDF before quoting an equation number to a verifier.

methodology:
  id: VM0047
  title: Afforestation, Reforestation, and Revegetation
  version: "1.1"
  active_since: "2025-05-14"
  publisher: Verra (Verified Carbon Standard)
  sectoral_scope: 14

constants:
  carbon_fraction: 0.47          # CF, t C per t dry matter. VM0047 parameter table; IPCC 2006.
  co2_per_c: 3.6666666667        # 44/12. VM0047 Eq. (1).

approach_selection:
  # Census-based: direct planting, no land-use change, at most 50 planting
  # units per hectare (v1.1). Otherwise area-based.
  census_max_planting_units_per_ha: 50
  # Area-based applies where planting produces continuous tree or shrub cover
  # on a contiguous area above one hectare.
  area_based_min_contiguous_cover_ha: 1.0

uncertainty:
  confidence_level: 0.90         # 90 % two-sided CI, half-width as % of the mean. Section 8.4.
  allowance: 0.10                # Ex post: UNC = max(0, U - 10 %). Eqs. (27) and (28).
  exante_minimum_deduction: 0.10 # Ex ante: "A minimum uncertainty deduction of 10 percent must be applied." Section 8.6.
  max_ci_halfwidth: 1.00         # CR = 0 where the 90 % CI half-width exceeds 100 % of the estimate.

performance_benchmark:           # Area-based approach only. Appendix 1.
  z_critical: 1.96               # Slopes differ where |Z| >= 1.96. Eq. (A5).
  control_p_max: 0.05            # Control slope set to zero where P > 0.05 or slope is negative. Eq. (A6).
  sdm_max: 0.25                  # Standardised difference of means per covariate. Eq. (A2).
  min_project_plots: 30
  min_time_steps: 3
  donor_radius_km: 100
  max_resolution_m: 30

exante:
  horizon_years: 10              # "estimates must be made for the 10-year period from time t to t+10." Section 8.6.

monitoring:
  max_interval_years: 5          # Biomass and mortality measured every five years or more often. Section 9.

leakage:                         # VMD0054 (Estimating Leakage from the Displacement of Agricultural Activities).
  census_based: 0.0              # Leakage set to zero for the census-based approach. VM0047 Section 8.3.
  supply_increase_share: 0.75    # IS, agriculture default.
  new_land_share: 0.40           # NL, agriculture default.
  yield_growth_rate: 0.025       # r default.
  assessment_years: 5
  deadwood_litter_factor: 1.1

buffer:                          # VCS AFOLU Non-Permanence Risk Tool v4.2.
  minimum_rating: 12             # "The minimum risk rating shall be 12." Section 2.5.2.
  fail_overall: 60               # Above this the project fails the risk analysis. Section 2.5.3.
  fail_internal: 35
  fail_external: 20
  fail_natural: 35

pools:                           # VM0047 Tables 1 and 2, area-based approach.
  aboveground_woody: included
  belowground_woody: included
  soil_organic_carbon: optional  # Required only where soil is disturbed more than once or inverted below 25 cm.
  dead_wood: optional
  litter: optional
  harvested_wood_products: excluded
